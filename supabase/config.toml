# Configuration locale Supabase (Phase 1). À valider au premier `supabase start` :
# la structure exacte dépend de la version du CLI installée.
project_id = "commerce-saas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# D4 : inscription publique fermée. Les comptes sont créés par invitation (API admin).
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

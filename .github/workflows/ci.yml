name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Contrôles statiques (sans dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-migrations.mjs
      - run: node scripts/check-permission-drift.mjs
      - run: node scripts/check-secrets.mjs
      - run: node scripts/verify-pure-logic.mjs
      - run: node scripts/run-unit-tests.mjs

  app:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Aucun secret ne doit se retrouver dans le bundle client
      - name: Bundle client sans clé privée
        run: |
          if grep -rIl --include='*.js' -e 'SUPABASE_SERVICE_ROLE_KEY' .next/static 2>/dev/null; then
            echo "Fuite potentielle de secret dans le bundle client"; exit 1
          fi

  database:
    name: Base de données (migrations + pgTAP + lint)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Base LOCALE ÉPHÉMÈRE de CI : jetable, aucune donnée réelle, détruite en fin de job.
      - run: supabase start
      - run: supabase db lint --fail-on error
      - run: supabase test db

  secrets-scan:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
